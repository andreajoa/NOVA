name: Restore Annual Plan Option
on:
  push:
    branches: [main]
    paths: [".github/workflows/restore-annual.yml"]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore billing UI and checkout
        run: |
          git checkout 6a134187131ca83cf3132282caf37f460ada2a28 -- src/app/pricing/page.jsx src/app/api/checkout/plans/session/route.ts
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/app/pricing/page.jsx')
          s = p.read_text()
          s = s.replace('import Image from "next/image";\n', '')
          s = re.sub(r'<a href="(/[^"]*)"([^>]*)>(.*?)</a>', r'<Link href="\1"\2>\3</Link>', s, flags=re.S)
          for marker in ['      "70 credits/mo",','      "500 credits/mo",','      "3,000 credits/mo",','      "3,000 credits in total/mo",']:
              if '20 NOVA VIDEO generations/mo' not in s[s.find(marker):s.find(marker)+140]:
                  s = s.replace(marker, marker+'\n      "20 NOVA VIDEO generations/mo",', 1)
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx eslint src/app/pricing/page.jsx src/app/api/checkout/plans/session/route.ts
      - run: npx tsc --noEmit --pretty false
      - name: Verify monthly quota remains
        run: |
          grep -q 'videoMonthlyLimit: 20' src/lib/freeGenerationQuota.js
          grep -q 'billing !== "annual"' src/lib/freeGenerationQuota.js
          grep -q 'basic_annual' src/app/api/checkout/plans/session/route.ts
          grep -q 'billing=${annual ? "annual" : "monthly"}' src/app/pricing/page.jsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pricing/page.jsx src/app/api/checkout/plans/session/route.ts
          git diff --cached --check
          git commit -m "feat: restore annual plans with monthly video quota"
          git push origin main
