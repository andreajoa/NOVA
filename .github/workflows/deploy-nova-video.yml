name: Deploy NOVA Video Engine

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/modal/**"
      - ".github/workflows/deploy-nova-video.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: pip install --upgrade modal

      - name: Validate deployment secrets
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          NOVA_VIDEO_MODEL_REPO: ${{ secrets.NOVA_VIDEO_MODEL_REPO }}
          NOVA_VIDEO_WORKER_SECRET: ${{ secrets.NOVA_VIDEO_WORKER_SECRET }}
        run: |
          test -n "$MODAL_TOKEN_ID" || (echo "MODAL_TOKEN_ID is missing" && exit 1)
          test -n "$MODAL_TOKEN_SECRET" || (echo "MODAL_TOKEN_SECRET is missing" && exit 1)
          test -n "$NOVA_VIDEO_MODEL_REPO" || (echo "NOVA_VIDEO_MODEL_REPO is missing" && exit 1)
          test -n "$NOVA_VIDEO_WORKER_SECRET" || (echo "NOVA_VIDEO_WORKER_SECRET is missing" && exit 1)

      - name: Create or update private engine secret
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          NOVA_VIDEO_MODEL_REPO: ${{ secrets.NOVA_VIDEO_MODEL_REPO }}
          NOVA_VIDEO_WORKER_SECRET: ${{ secrets.NOVA_VIDEO_WORKER_SECRET }}
        run: |
          modal secret create --force nova-video-engine \
            NOVA_VIDEO_MODEL_REPO="$NOVA_VIDEO_MODEL_REPO" \
            NOVA_VIDEO_WORKER_SECRET="$NOVA_VIDEO_WORKER_SECRET" \
            NOVA_VIDEO_STEPS="8"

      - name: Deploy NOVA video engine
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy infra/modal/nova_video_worker.py
