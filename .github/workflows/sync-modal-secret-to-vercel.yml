name: Sync NOVA Modal Secret to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-modal-secret-to-vercel.yml"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOVA_VIDEO_WORKER_SECRET: ${{ secrets.NOVA_VIDEO_WORKER_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: andre-almeidas-projects-7fa48c22
      VERCEL_PROJECT: nova
    steps:
      - uses: actions/checkout@v4

      - name: Check sync credentials
        id: config
        shell: bash
        run: |
          if [ -n "${NOVA_VIDEO_WORKER_SECRET:-}" ] && [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "SYNC_CREDENTIALS_OK"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ -z "${NOVA_VIDEO_WORKER_SECRET:-}" ]; then echo "MISSING_NOVA_VIDEO_WORKER_SECRET"; fi
            if [ -z "${VERCEL_TOKEN:-}" ]; then echo "MISSING_VERCEL_TOKEN"; fi
          fi

      - name: Install Vercel CLI
        if: steps.config.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Link NOVA Vercel project
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Sync Modal worker secret to Production
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          vercel env rm NOVA_MODAL_VIDEO_SECRET production --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          printf '%s' "$NOVA_VIDEO_WORKER_SECRET" | vercel env add NOVA_MODAL_VIDEO_SECRET production --token "$VERCEL_TOKEN"
          echo "VERCEL_MODAL_SECRET_SYNCED"

      - name: Redeploy production with synced secret
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          vercel --prod --yes --token "$VERCEL_TOKEN"
