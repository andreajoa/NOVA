# one-time monthly billing migration validator
name: Apply NOVA Monthly Billing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-monthly-only-billing.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply monthly billing patch
        run: python scripts/apply_monthly_only_billing.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint pricing and checkout
        run: npx eslint src/app/pricing/page.jsx src/app/api/checkout/plans/session/route.ts

      - name: Type-check NOVA
        run: npx tsc --noEmit --pretty false

      - name: Verify monthly billing
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'billing=monthly' src/app/pricing/page.jsx
          grep -q '20 NOVA VIDEO generations/mo' src/app/pricing/page.jsx
          grep -q 'Renews automatically' src/app/pricing/page.jsx
          grep -q 'const billing = "monthly"' src/app/api/checkout/plans/session/route.ts
          grep -q 'mode: "subscription"' src/app/api/checkout/plans/session/route.ts
          if grep -Eq 'basic_annual|plus_annual|ultra_annual|business_annual|billing=annual' src/app/api/checkout/plans/session/route.ts src/app/pricing/page.jsx; then
            echo "Annual purchase path remains enabled."
            exit 1
          fi
          echo "NOVA monthly-only billing contracts: OK"

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pricing/page.jsx src/app/api/checkout/plans/session/route.ts
          git diff --cached --check
          git commit -m "feat: make NOVA plans monthly-only"
          git push origin HEAD:main
