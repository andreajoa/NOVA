name: Transfer NOVA worker configuration
on:
  push:
    branches: [nexacloud-deploy]
    paths: [.github/workflows/nova-transfer-worker.yml]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Seal worker credential for NexaCloud migration
        env:
          WORKER_SECRET: ${{ secrets.NOVA_VIDEO_WORKER_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WORKER_SECRET"
          cat > /tmp/nova-migration.pub <<'PUBLIC_KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAqecsOCQaYy9GW6skdD9Y
          nfSv6BExgmOVJ3bZJpX9sYeMm1Z3vxMAmg4cVes+PuSzaQp8QbUat2m5fxdLp2Tj
          H/4T2stDC0QRYdJfUqskCJO3nZG8+TFe9ovE4Zc53t/7bGeTI6gft77lbFeA2A9a
          uLwKPcXg1lw2lmIroEhtKq2JQ4uWrOo/uX1G9kn4h0LfHqkAlzBZkRi0yvfdFYt3
          Ve1WbkCsiVCWWeqsGZXtWEOmK51YkSftU+XHtAYXFh0mMT8xbE7PblXDcynLK5YG
          Jr8tMXagsA2OmAAP/jBJkZLFDFsvZWjId0GNLU8SRA02/Y0wgMZYvKJlNFUG97x3
          4QIDAQAB
          -----END PUBLIC KEY-----
          PUBLIC_KEY
          printf '%s' "$WORKER_SECRET" | openssl pkeyutl -encrypt -pubin -inkey /tmp/nova-migration.pub -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 > nova-worker.sealed
      - uses: actions/upload-artifact@v4
        with:
          name: nova-worker-sealed
          path: nova-worker.sealed
          retention-days: 1
