name: Diagnose NOVA Modal Video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-modal-video.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal>=1.5,<2"

      - name: Show app state
        run: |
          modal app list
          modal app history nova-video-engine --json || true

      - name: Fetch recent NOVA Modal logs
        run: |
          echo "===== ALL RECENT LOGS ====="
          modal app logs nova-video-engine --since 3h --tail 2000 --timestamps --show-function-id --show-function-call-id --show-container-id || true
          echo "===== STDERR ====="
          modal app logs nova-video-engine --since 3h --tail 1000 --source stderr --timestamps --show-function-id --show-function-call-id --show-container-id || true
          echo "===== SYSTEM ====="
          modal app logs nova-video-engine --since 3h --tail 1000 --source system --timestamps --show-function-id --show-function-call-id --show-container-id || true
