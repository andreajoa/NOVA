name: Fix NOVA Modal Video Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-modal-video-runtime.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Modal worker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path("infra/modal/nova_video_worker.py")
          text = worker.read_text(encoding="utf-8")
          text = text.replace("from __future__ import annotations\n\n", "", 1)

          if '"einops>=0.8,<1",' not in text:
              text = text.replace(
                  '    "easydict",\n    "fastapi[standard]",',
                  '    "easydict",\n    "einops>=0.8,<1",\n    "fastapi[standard]",',
                  1,
              )

          text = text.replace(
              'call = NovaWanSpeechVideo().generate.spawn(payload)',
              'call = await NovaWanSpeechVideo().generate.spawn.aio(payload)',
          )
          text = text.replace(
              'call = NovaWanVideo().generate.spawn(payload)',
              'call = await NovaWanVideo().generate.spawn.aio(payload)',
          )

          helper = '''\n\ndef _prepare_normal_wan_runtime() -> None:\n    """Keep optional Wan pipelines from breaking the normal TI2V worker."""\n    init_file = WAN_CODE / "wan" / "__init__.py"\n    source = init_file.read_text(encoding="utf-8")\n    optional_imports = [\n        ("from .speech2video import WanS2V", "WanS2V"),\n        ("from .animate import WanAnimate", "WanAnimate"),\n    ]\n    for needle, symbol in optional_imports:\n        replacement = f"try:\\n    {needle}\\nexcept ImportError:\\n    {symbol} = None"\n        if needle in source:\n            source = source.replace(needle, replacement, 1)\n    init_file.write_text(source, encoding="utf-8")\n'''
          normal_marker = '\n\ndef _normal_generate(payload: dict) -> str:\n'
          if 'def _prepare_normal_wan_runtime()' not in text:
              text = text.replace(normal_marker, helper + normal_marker, 1)

          text = text.replace(
              'def _normal_generate(payload: dict) -> str:\n    _ensure_model(TI2V_REPO, TI2V_DIR)',
              'def _normal_generate(payload: dict) -> str:\n    _prepare_normal_wan_runtime()\n    _ensure_model(TI2V_REPO, TI2V_DIR)',
              1,
          )

          smoke = '''\n\n@app.function(image=base_image, gpu="L4", timeout=120, memory=8192)\ndef smoke_import():\n    """Fail early if the normal Wan runtime has missing imports."""\n    _prepare_normal_wan_runtime()\n    import wan  # noqa: F401\n    from einops import rearrange  # noqa: F401\n    assert wan.WanTI2V is not None\n    return {"ok": True, "wan": True, "einops": True, "ti2v": True}\n'''
          marker = '\n\n@app.function(image=base_image, volumes={str(MODEL_ROOT): model_volume}, timeout=45 * 60, memory=65536)\ndef preload_models'
          if 'def smoke_import()' not in text:
              text = text.replace(marker, smoke + marker, 1)

          worker.write_text(text, encoding="utf-8")
          PY

      - name: Validate source patch
        run: |
          python -m py_compile infra/modal/nova_video_worker.py
          grep -q 'einops>=0.8,<1' infra/modal/nova_video_worker.py
          grep -q 'spawn.aio(payload)' infra/modal/nova_video_worker.py
          grep -q 'def _prepare_normal_wan_runtime' infra/modal/nova_video_worker.py
          grep -q 'from .animate import WanAnimate' infra/modal/nova_video_worker.py
          grep -q '_prepare_normal_wan_runtime()' infra/modal/nova_video_worker.py
          grep -q 'gpu="L4"' infra/modal/nova_video_worker.py
          grep -q 'def smoke_import' infra/modal/nova_video_worker.py

      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal>=1.5,<2"

      - name: Smoke-test normal Wan runtime on L4
        shell: bash
        run: |
          set -euo pipefail
          modal run infra/modal/nova_video_worker.py::smoke_import

      - name: Commit worker repair
        shell: bash
        run: |
          git config user.name "andreajoa"
          git config user.email "100246160+andreajoa@users.noreply.github.com"
          git add infra/modal/nova_video_worker.py
          git commit -m "fix: repair Wan runtime imports and async dispatch"
          git push origin main
