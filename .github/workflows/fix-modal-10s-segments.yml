name: Fix NOVA Wan 10s Memory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-modal-10s-segments.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Split 10 second Wan jobs into supported 5 second segments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("infra/modal/nova_video_worker.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def _normal_generate(payload: dict) -> str:\n")
          end = text.index("\ndef _speech_generate(payload: dict) -> str:\n", start)
          replacement = '''def _run_normal_segment(
              *,
              prompt: str,
              aspect: str,
              steps: int,
              seed: int,
              output: Path,
              reference: Path | None = None,
          ) -> None:
              """Render one Wan TI2V segment at the model's supported 121-frame length."""
              command = [
                  "python", str(WAN_CODE / "generate.py"),
                  "--task", "ti2v-5B",
                  "--size", _size(aspect),
                  "--ckpt_dir", str(TI2V_DIR),
                  "--offload_model", "True",
                  "--convert_model_dtype",
                  "--t5_cpu",
                  "--prompt", prompt,
                  "--frame_num", "121",
                  "--sample_steps", str(steps),
                  "--base_seed", str(seed),
                  "--save_file", str(output),
              ]
              if reference is not None:
                  command.extend(["--image", str(reference)])
              subprocess.run(command, cwd=str(WAN_CODE), check=True, timeout=11 * 60)


          def _normal_generate(payload: dict) -> str:
              _prepare_normal_wan_runtime()
              _ensure_model(TI2V_REPO, TI2V_DIR)
              prompt = str(payload.get("prompt") or "").strip()
              task = str(payload.get("task") or "text-to-video")
              if not prompt:
                  raise ValueError("Prompt is required")
              if task not in {"text-to-video", "image-to-video", "continue-video"}:
                  raise ValueError("Unsupported normal video task")

              duration = max(5, min(10, int(payload.get("duration") or 5)))
              aspect = str(payload.get("aspect_ratio") or "16:9")
              steps = max(4, min(50, int(os.environ.get("NOVA_WAN_SAMPLE_STEPS", "24"))))
              seed = int(payload.get("seed") or int(time.time() * 1000) % 2_147_483_647)

              with tempfile.TemporaryDirectory() as tmpdir:
                  tmp = Path(tmpdir)
                  first = tmp / "segment-1.mp4"
                  reference: Path | None = None
                  source_video: Path | None = None

                  if task == "image-to-video":
                      reference = tmp / "reference.jpg"
                      _download(str(payload.get("image_url") or ""), reference, 20_000_000)
                  elif task == "continue-video":
                      source_video = tmp / "source.mp4"
                      reference = tmp / "last-frame.png"
                      _download(str(payload.get("source_video_url") or ""), source_video)
                      _extract_last_frame(source_video, reference)

                  _run_normal_segment(
                      prompt=prompt,
                      aspect=aspect,
                      steps=steps,
                      seed=seed,
                      output=first,
                      reference=reference,
                  )

                  result = first
                  if duration > 5:
                      bridge = tmp / "segment-1-last.png"
                      second = tmp / "segment-2.mp4"
                      joined = tmp / "generated-10s.mp4"
                      _extract_last_frame(first, bridge)
                      continuation_prompt = (
                          prompt
                          + "\\nContinue seamlessly from the supplied reference frame. Preserve the same "
                            "characters, wardrobe, location, lighting, camera direction and visual style. "
                            "Advance the action naturally without restarting the scene."
                      )
                      _run_normal_segment(
                          prompt=continuation_prompt,
                          aspect=aspect,
                          steps=steps,
                          seed=(seed + 1) % 2_147_483_647,
                          output=second,
                          reference=bridge,
                      )
                      _concat(first, second, joined)
                      result = joined

                  if aspect == "1:1":
                      square = tmp / "square.mp4"
                      _crop_square(result, square)
                      result = square
                  if source_video is not None:
                      combined = tmp / "combined.mp4"
                      _concat(source_video, result, combined)
                      result = combined
                  return _upload(payload, result)

          '''
          text = text[:start] + replacement + text[end + 1:]
          text = text.replace("    timeout=12 * 60,\n    scaledown_window=30,\n", "    timeout=18 * 60,\n    scaledown_window=30,\n", 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate worker
        run: |
          python -m py_compile infra/modal/nova_video_worker.py
          grep -q '"--frame_num", "121"' infra/modal/nova_video_worker.py
          grep -q 'if duration > 5' infra/modal/nova_video_worker.py
          grep -q 'generated-10s.mp4' infra/modal/nova_video_worker.py
          grep -q 'timeout=18 \* 60' infra/modal/nova_video_worker.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "andreajoa"
          git config user.email "100246160+andreajoa@users.noreply.github.com"
          git add infra/modal/nova_video_worker.py
          git commit -m "fix: render 10s Wan video as two 121-frame segments"
          git push origin main
