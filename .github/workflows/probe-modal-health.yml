name: Probe NOVA Modal Health
# Segmented 10s verification: 2026-08-29 23:00 UTC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-modal-health.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      NOVA_VIDEO_WORKER_SECRET: ${{ secrets.NOVA_VIDEO_WORKER_SECRET }}
    steps:
      - name: Check Modal health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "https://tdahma2--nova-video-engine-api.modal.run/health" \
            | tee modal-health.json
          echo
          python - <<'PY'
          import json
          with open("modal-health.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("ok") is True, data
          assert data.get("provider") == "modal", data
          expected = {"text-to-video", "image-to-video", "continue-video", "speech-video"}
          actual = set(data.get("tasks") or [])
          missing = expected - actual
          assert not missing, f"Missing tasks: {sorted(missing)}; response={data}"
          print("MODAL_HEALTH_OK")
          print("tasks=" + ",".join(sorted(actual)))
          PY

      - name: Verify worker secret without starting GPU generation
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl --silent --show-error --max-time 30 \
            -o modal-auth.json -w "%{http_code}" \
            -X POST "https://tdahma2--nova-video-engine-api.modal.run/" \
            -H "Authorization: Bearer ${NOVA_VIDEO_WORKER_SECRET}" \
            -H "Content-Type: application/json" \
            --data '{"input":{"task":"__auth-probe__"}}')
          cat modal-auth.json
          echo
          echo "HTTP_STATUS=${STATUS}"
          test "${STATUS}" = "400"
          grep -q "Unsupported task" modal-auth.json
          echo "MODAL_AUTH_OK"
