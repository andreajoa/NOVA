name: LTX Fast API Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-ltx-fast-api.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect LTX Fast API
        shell: python
        run: |
          import json, urllib.request
          base = "https://lightricks-ltx-video-distilled.hf.space"
          for suffix in ("/gradio_api/info", "/info"):
              try:
                  req=urllib.request.Request(base+suffix,headers={"User-Agent":"NOVA-ltx-fast-probe/1.0"})
                  with urllib.request.urlopen(req,timeout=45) as r:
                      data=json.loads(r.read().decode("utf-8","replace"))
                  print("INFO_URL",base+suffix)
                  print("NAMED_ENDPOINTS",json.dumps(data.get("named_endpoints") or {},ensure_ascii=False)[:30000])
                  raise SystemExit(0)
              except Exception as exc:
                  print("ERR",suffix,type(exc).__name__,str(exc)[:300])
          raise SystemExit(1)
