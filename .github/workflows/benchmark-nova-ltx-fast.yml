name: Benchmark NOVA LTX Fast

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/benchmark-nova-ltx-fast.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal>=1.4,<2"

      - name: Preload public LTX checkpoint on CPU
        run: modal run experiments/modal/ltx_fast_benchmark.py::preload 2>&1 | tee ltx-preload.log

      - name: Run real 5-second H100 benchmark
        run: modal run experiments/modal/ltx_fast_benchmark.py::benchmark --duration 5 2>&1 | tee ltx-benchmark.log

      - name: Show measured result
        shell: bash
        run: |
          grep -E "NOVA_LTX (PRELOAD|BENCHMARK)|Output saved|Padded dimensions" ltx-preload.log ltx-benchmark.log || true

      - name: Store benchmark logs
        uses: actions/upload-artifact@v4
        with:
          name: nova-ltx-fast-benchmark
          path: |
            ltx-preload.log
            ltx-benchmark.log
          retention-days: 2
