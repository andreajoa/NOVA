name: Sample NOVA Image Studio

# Manual QA: preloads the Qwen-Image studio weights on CPU, then renders image
# samples (text-to-image, avatar + product composition) and a full UGC product
# video through the LTX engine. Spends GPU time only when run.
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Also render the UGC video from the composed keyframe"
        default: "true"
        required: false
      entrypoint:
        description: "sample_studio (EN UGC) or sample_ugc_pt (PT UGC: native speech vs dub)"
        default: "sample_studio"
        required: false

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal
        run: python -m pip install --upgrade "modal>=1.4,<2"
      - name: Preload studio weights on CPU
        run: modal run infra/modal/nova_video_worker.py::preload_studio
      - name: Render studio samples
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.entrypoint }}" = "sample_ugc_pt" ]; then
            modal run infra/modal/nova_video_worker.py::sample_ugc_pt
          else
            if [ "${{ inputs.video }}" = "true" ]; then flag="--video"; else flag="--no-video"; fi
            modal run infra/modal/nova_video_worker.py::sample_studio $flag
          fi
      - name: Store samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-studio-samples
          path: samples/
