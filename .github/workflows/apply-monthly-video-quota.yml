name: Apply NOVA Monthly Video Quotas

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-monthly-video-quota.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply monthly quota migration
        run: python scripts/apply_monthly_video_quota.py

      - name: Harden generated quota and UI patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          usage = Path("src/app/api/free-usage/route.js")
          text = usage.read_text(encoding="utf-8")
          marker = '  const [image, video] = await Promise.all(['
          if marker not in text:
              raise SystemExit("Non-admin usage marker not found")
          admin_part, user_part = text.split(marker, 1)
          admin_lines = [
              line for line in admin_part.splitlines()
              if 'active: video.active !== false' not in line
              and 'paymentRequired: video.reason === "subscription_payment_required"' not in line
          ]
          admin_part = '\n'.join(admin_lines) + '\n'
          needle = '      available: videoAvailable,\n'
          addition = '      available: videoAvailable,\n      active: video.active !== false,\n      paymentRequired: video.reason === "subscription_payment_required",\n'
          if needle not in user_part:
              raise SystemExit("Non-admin video availability line not found")
          user_part = user_part.replace(needle, addition, 1)
          usage.write_text(admin_part + marker + user_part, encoding="utf-8")

          quota = Path("src/lib/freeGenerationQuota.js")
          text = quota.read_text(encoding="utf-8")
          old = '    const subscription = await stripe.subscriptions.retrieve(subscriptionId);\n    const { start, end, item } = subscriptionPeriod(subscription);\n    const billingInterval = normalizedBillingInterval(account?.billing_interval, item);\n    const active = subscription?.status === "active";\n'
          new = '    const subscription = await stripe.subscriptions.retrieve(subscriptionId, {\n      expand: ["latest_invoice"],\n    });\n    const { start, end, item } = subscriptionPeriod(subscription);\n    const billingInterval = normalizedBillingInterval(account?.billing_interval, item);\n    const latestInvoiceStatus = typeof subscription.latest_invoice === "object"\n      ? String(subscription.latest_invoice?.status || "")\n      : "";\n    const active = subscription?.status === "active" && latestInvoiceStatus === "paid";\n'
          if old not in text:
              raise SystemExit("Expected Stripe cycle refresh block not found")
          quota.write_text(text.replace(old, new, 1), encoding="utf-8")

          checkout = Path("src/app/api/checkout/plans/session/route.ts")
          text = checkout.read_text(encoding="utf-8")
          old = '  } catch (err: any) {\n    console.error("Plan checkout error:", err);\n    return NextResponse.json({ error: err.message }, { status: 500 });\n'
          new = '  } catch (err: unknown) {\n    const message = err instanceof Error ? err.message : "Unexpected checkout error";\n    console.error("Plan checkout error:", err);\n    return NextResponse.json({ error: message }, { status: 500 });\n'
          if old not in text:
              raise SystemExit("Expected checkout catch block not found")
          checkout.write_text(text.replace(old, new, 1), encoding="utf-8")

          studio = Path("src/components/NovaFreeVideoStudio.jsx")
          text = studio.read_text(encoding="utf-8")
          effect = '  useEffect(() => {\n    if (usage && exhausted && !paidUser) setShowUpgradePopup(true);\n  }, [usage, exhausted, paidUser]);\n\n'
          text = text.replace(effect, '', 1)
          initial = '        if (!cancelled && response.ok && payload?.success) setUsage(payload);\n'
          upgraded = '        if (!cancelled && response.ok && payload?.success) {\n          setUsage(payload);\n          const freeExhausted = !payload?.paid && !payload?.admin && Number(payload?.video?.remaining ?? 1) <= 0;\n          if (freeExhausted) setShowUpgradePopup(true);\n        }\n'
          if initial not in text:
              raise SystemExit("Expected initial usage load line not found")
          text = text.replace(initial, upgraded, 1)
          for old, new in {
              'gerações hoje.': 'gerações neste mês.',
              'Limite diário utilizado': 'Limite mensal utilizado',
              'nova geração diária.': 'nova geração mensal.',
          }.items():
              text = text.replace(old, new)
          studio.write_text(text, encoding="utf-8")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed quota and billing files
        run: |
          npx eslint \
            src/lib/freeGenerationQuota.js \
            src/app/api/webhooks/stripe/route.js \
            src/app/api/checkout/plans/session/route.ts \
            src/app/api/free-video-generate/route.js \
            src/app/api/free-usage/route.js \
            src/components/NovaFreeVideoStudio.jsx

      - name: Type-check NOVA
        run: npx tsc --noEmit --pretty false

      - name: Verify monthly quota contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'videoMonthlyLimit: 10' src/lib/freeGenerationQuota.js
          grep -q 'videoMonthlyLimit: 20' src/lib/freeGenerationQuota.js
          grep -q 'latestInvoiceStatus' src/lib/freeGenerationQuota.js
          grep -q 'NOVA_FREE_VIDEO_MONTHLY_LIMIT_REACHED' src/app/api/free-video-generate/route.js
          grep -q 'NOVA_VIDEO_MONTHLY_LIMIT_REACHED' src/app/api/free-video-generate/route.js
          grep -q 'NOVA_SUBSCRIPTION_PAYMENT_REQUIRED' src/app/api/free-video-generate/route.js
          grep -q 'invoice.payment_failed' src/app/api/webhooks/stripe/route.js
          grep -q 'customer.subscription.deleted' src/app/api/webhooks/stripe/route.js
          grep -q 'subscription_data' src/app/api/checkout/plans/session/route.ts
          grep -q 'Seus vídeos grátis do mês acabaram' src/components/NovaFreeVideoStudio.jsx
          grep -q '20 vídeos por mês' src/components/NovaFreeVideoStudio.jsx
          if grep -q 'limite diário de NOVA VIDEO' src/components/NovaFreeVideoStudio.jsx; then
            echo 'Daily video quota copy remains in the studio.'
            exit 1
          fi
          echo 'NOVA monthly video quota contracts: OK'

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/freeGenerationQuota.js \
            src/app/api/webhooks/stripe/route.js \
            src/app/api/checkout/plans/session/route.ts \
            src/app/api/free-video-generate/route.js \
            src/app/api/free-usage/route.js \
            src/components/NovaFreeVideoStudio.jsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "feat: enforce monthly NOVA video quotas"
          git push origin HEAD:main
