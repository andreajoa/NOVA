name: Diagnose NOVA Modal Video

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-nova-video.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal>=1.4,<2"

      - name: Capture recent Modal runtime logs
        shell: bash
        run: |
          set +e
          if [ -z "${MODAL_TOKEN_ID:-}" ] || [ -z "${MODAL_TOKEN_SECRET:-}" ]; then
            echo "Modal credentials are missing."
            exit 1
          fi

          timeout 75s modal app logs nova-video-engine --since 6h --tail 3000 > modal-runtime.log 2>&1
          rc=$?
          echo "modal app logs exit code: $rc"

          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("modal-runtime.log")
          text = source.read_text(encoding="utf-8", errors="replace") if source.exists() else ""
          keep = re.compile(
              r"NOVA_VIDEO|Traceback|Error|Exception|CUDA|timeout|timed out|OOM|OutOfMemory|SIGKILL|killed|GPU|CalledProcessError|subprocess|exit code|NoSuchApp|not found",
              re.IGNORECASE,
          )
          lines = [line for line in text.splitlines() if keep.search(line)]
          summary = "\n".join(lines[-1200:])
          Path("modal-runtime-summary.log").write_text(summary + ("\n" if summary else ""), encoding="utf-8")
          print(summary or "No matching runtime error/timing lines were found.")
          PY

          exit 0

      - name: Store diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: nova-modal-runtime-diagnostics
          path: |
            modal-runtime-summary.log
          if-no-files-found: warn
          retention-days: 2
