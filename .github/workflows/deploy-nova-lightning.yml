name: Deploy NOVA Lightning Video Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/lightning/**"
      - ".github/workflows/deploy-nova-lightning.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
      LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
      NOVA_VIDEO_WORKER_SECRET: ${{ secrets.NOVA_VIDEO_WORKER_SECRET }}
      NOVA_LIGHTNING_DEPLOY_SPEECH: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Lightning worker syntax
        run: |
          python -m py_compile infra/lightning/nova_video_server.py
          python -m py_compile infra/lightning/deploy.py

      - name: Check deployment configuration
        id: config
        shell: bash
        run: |
          if [ -n "${LIGHTNING_USER_ID:-}" ] && \
             [ -n "${LIGHTNING_API_KEY:-}" ] && \
             [ -n "${NOVA_VIDEO_WORKER_SECRET:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "NOVA Lightning deployment credentials are present."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Lightning credentials are not configured; validation passed and deployment is skipped."
          fi

      - name: Install Lightning SDK
        if: steps.config.outputs.configured == 'true'
        run: python -m pip install --upgrade lightning-sdk

      - name: Resolve Lightning scope safely
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess

          proc = subprocess.run(
              ["lightning", "api", "/v1/memberships"],
              check=True,
              capture_output=True,
              text=True,
          )
          data = json.loads(proc.stdout)
          memberships = data.get("memberships") or []
          print(f"LIGHTNING_MEMBERSHIP_COUNT={len(memberships)}")
          for index, membership in enumerate(memberships):
              safe = {
                  "index": index,
                  "ownerType": membership.get("ownerType"),
                  "name": membership.get("name"),
                  "projectId": membership.get("projectId"),
                  "ownerId": membership.get("ownerId"),
              }
              print("LIGHTNING_MEMBERSHIP=" + json.dumps(safe, ensure_ascii=False))
          if not memberships:
              raise SystemExit("No Lightning memberships were returned")
          PY

      # Deployment resumes after the authenticated Lightning scope is resolved.
