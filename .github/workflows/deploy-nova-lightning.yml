name: Deploy NOVA Lightning Video Workers

# Deploy trigger 2026-08-29: Lightning credentials configured; run deployment.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/lightning/**"
      - ".github/workflows/deploy-nova-lightning.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      LIGHTNING_USER_ID: ${{ secrets.LIGHTNING_USER_ID }}
      LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
      LIGHTNING_TEAMSPACE: ${{ secrets.LIGHTNING_TEAMSPACE }}
      LIGHTNING_ORG: ${{ secrets.LIGHTNING_ORG }}
      NOVA_VIDEO_WORKER_SECRET: ${{ secrets.NOVA_VIDEO_WORKER_SECRET }}
      NOVA_LIGHTNING_DEPLOY_SPEECH: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Lightning worker syntax
        run: |
          python -m py_compile infra/lightning/nova_video_server.py
          python -m py_compile infra/lightning/deploy.py

      - name: Check deployment configuration
        id: config
        shell: bash
        run: |
          if [ -n "${LIGHTNING_USER_ID:-}" ] && \
             [ -n "${LIGHTNING_API_KEY:-}" ] && \
             [ -n "${NOVA_VIDEO_WORKER_SECRET:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "NOVA Lightning deployment credentials are present."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Lightning credentials are not configured; validation passed and deployment is skipped."
          fi

      - name: Install Lightning SDK
        if: steps.config.outputs.configured == 'true'
        run: python -m pip install --upgrade lightning-sdk

      - name: Deploy Lightning workers
        if: steps.config.outputs.configured == 'true'
        run: python infra/lightning/deploy.py

      - name: Store Lightning endpoint artifact
        if: steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nova-lightning-video-urls
          path: lightning-urls.json
          if-no-files-found: error
          retention-days: 7
