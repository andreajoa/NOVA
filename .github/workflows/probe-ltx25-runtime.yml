name: LTX 2.5 Free Runtime Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-ltx25-runtime.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Generate 5s T2V through high-level API
        shell: python
        run: |
          import json, urllib.request

          base = "https://rioshiina-ltx-2-5.hf.space"
          api = "run"
          params = {
              "task_type": "t2v",
              "prompt": "A paper airplane gliding above a sunny park, cinematic natural motion",
              "negative_prompt": "low quality, distorted",
              "resolution": "544p",
              "aspect_ratio": "16:9 (Landscape)",
              "width": 960,
              "height": 544,
              "duration": 5.0,
              "fps": "24fps",
              "seed": 42,
              "zero_gpu_duration": 60,
              "use_spatial_upscaler": False,
              "use_temporal_upscaler": False,
          }
          payload = json.dumps({"data": [json.dumps(params)]}).encode()

          def request(url, method="GET", data=None, timeout=180):
              headers = {
                  "User-Agent": "NOVA-ltx25-probe/1.0",
                  "Accept": "text/event-stream, application/json",
              }
              if data is not None:
                  headers["Content-Type"] = "application/json"
              return urllib.request.urlopen(urllib.request.Request(url, data=data, method=method, headers=headers), timeout=timeout)

          roots = [base + "/gradio_api/call/" + api, base + "/call/" + api]
          errors = []
          for root in roots:
              try:
                  with request(root, "POST", payload, 60) as r:
                      submit_text = r.read().decode("utf-8", "replace")
                  submit = json.loads(submit_text)
                  event_id = submit.get("event_id")
                  if not event_id:
                      errors.append(root + ": no event_id " + submit_text[:500])
                      continue
                  print("SUBMIT_OK", root, event_id)
                  with request(root + "/" + event_id, timeout=360) as r:
                      stream = r.read().decode("utf-8", "replace")
                  print("STREAM_TAIL", stream[-6000:])
                  data = None
                  for block in stream.replace("\r\n", "\n").split("\n\n"):
                      if "event: error" in block:
                          errors.append(root + ": " + block[-1500:])
                          break
                      if "event: complete" in block:
                          line = next((x for x in block.splitlines() if x.startswith("data: ")), None)
                          if line:
                              data = json.loads(line[6:])
                              break
                  if data is None:
                      continue
                  print("COMPLETE", json.dumps(data)[:6000])

                  def find_video(v):
                      if isinstance(v, str) and v.startswith("http") and (".mp4" in v or "file=" in v):
                          return v
                      if isinstance(v, list):
                          for item in v:
                              found = find_video(item)
                              if found: return found
                      if isinstance(v, dict):
                          for item in v.values():
                              found = find_video(item)
                              if found: return found
                      return None

                  video = find_video(data)
                  if not video:
                      errors.append(root + ": completed but no video")
                      continue
                  with request(video, timeout=60) as vr:
                      ctype = vr.headers.get("content-type", "")
                      first = vr.read(64)
                  print("VIDEO_CHECK", ctype, b"ftyp" in first, video)
                  if "video" in ctype.lower() or b"ftyp" in first:
                      print("LTX25_RUNTIME_OK")
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  errors.append(root + ": " + type(exc).__name__ + ": " + str(exc))

          raise SystemExit("LTX25_RUNTIME_FAILED\n" + "\n".join(errors))
