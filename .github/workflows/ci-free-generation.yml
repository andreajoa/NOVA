name: NOVA Included Generation CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/free-open-image-video
      - feat/complex-video-prompt-director
      - fix/free-video-quality-pipeline
      - fix/free-video-motion-quality-gate
    paths:
      - "src/app/api/free-usage/**"
      - "src/app/api/free-video-generate/**"
      - "src/app/api/free-video-status/**"
      - "src/app/api/generate/**"
      - "src/app/api/internal/free-video-callback/**"
      - "src/app/dashboard/free/**"
      - "src/app/dashboard/models/[model]/[mode]/**"
      - "src/app/oauth/callback/huggingface/**"
      - "src/components/NovaFreeVideoStudio.jsx"
      - "src/components/NovaSpeechVideoStudio.jsx"
      - "src/components/NovaGenerationStudio.jsx"
      - "src/lib/cloudflareAiClient.js"
      - "src/lib/db.ts"
      - "src/lib/freeGenerationQuota.js"
      - "src/lib/freeProviderBudget.js"
      - "src/lib/freeVideoCapacity.js"
      - "src/lib/freeVideoJobs.js"
      - "src/lib/generationCatalog.js"
      - "src/lib/novaAdminAccess.js"
      - "src/lib/privateGpuVideoPool.js"
      - "src/lib/publicVideoJobRetry.js"
      - "src/lib/privateOpenModels.js"
      - "src/lib/publicGenerationCatalog.js"
      - "src/lib/falModels.js"
      - "src/lib/falEndpointInputs.js"
      - "scripts/test-fal-catalog.mjs"
      - "src/lib/r2.ts"
      - "src/lib/verifiedVideoRuntime.js"
      - "src/lib/videoPromptDirector.mjs"
      - "src/lib/videoPlanDirector.mjs"
      - "scripts/test-video-plan-director.mjs"
      - "scripts/test-video-prompt-director.mjs"
      - "src/lib/zeroCostVideoClient.js"
      - "infra/modal/**"
      - "infra/lightning/**"
      - ".github/workflows/ci-free-generation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint included generation files
        run: |
          npx eslint \
            src/app/api/free-usage/route.js \
            src/app/api/free-video-generate/route.js \
            src/app/api/free-video-status/route.js \
            src/app/api/generate/route.js \
            src/app/api/internal/free-video-callback/route.js \
            src/app/dashboard/free/page.jsx \
            'src/app/dashboard/models/[model]/[mode]/page.jsx' \
            src/app/oauth/callback/huggingface/page.jsx \
            src/components/NovaFreeVideoStudio.jsx \
            src/components/NovaSpeechVideoStudio.jsx \
            src/components/NovaGenerationStudio.jsx \
            src/lib/cloudflareAiClient.js \
            src/lib/freeGenerationQuota.js \
            src/lib/freeProviderBudget.js \
            src/lib/freeVideoCapacity.js \
            src/lib/freeVideoJobs.js \
            src/lib/generationCatalog.js \
            src/lib/novaAdminAccess.js \
            src/lib/privateGpuVideoPool.js \
            src/lib/publicVideoJobRetry.js \
            src/lib/privateOpenModels.js \
            src/lib/publicGenerationCatalog.js \
            src/lib/r2.ts \
            src/lib/verifiedVideoRuntime.js \
            src/lib/videoPromptDirector.mjs \
            src/lib/videoPlanDirector.mjs \
            scripts/test-video-plan-director.mjs \
            src/lib/zeroCostVideoClient.js \
            scripts/test-video-prompt-director.mjs

      - name: Validate complex video prompt director
        run: node scripts/test-video-prompt-director.mjs

      - name: Validate LLM video plan director
        run: node scripts/test-video-plan-director.mjs

      - name: Validate paid model catalog
        run: node scripts/test-fal-catalog.mjs

      - name: Validate TypeScript database module
        run: npx tsc --noEmit --pretty false

      - name: Validate GPU worker syntax
        run: |
          python -m py_compile infra/modal/nova_video_worker.py
          python -m py_compile infra/lightning/nova_video_server.py
          python -m py_compile infra/lightning/deploy.py

      - name: Validate NOVA free-generation contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'NOVA_VIDEO_DEDICATED_FLOW_REQUIRED' src/app/api/generate/route.js
          grep -q '/api/free-video-generate' src/components/NovaFreeVideoStudio.jsx
          grep -q 'speech-video' src/components/NovaSpeechVideoStudio.jsx
          grep -q 'reserveVideoCapacity' src/app/api/free-video-generate/route.js
          grep -q 'runPrivateGpuVideoPool' src/app/api/free-video-generate/route.js
          grep -q 'runVerifiedVideoRuntime' src/app/api/free-video-generate/route.js
          grep -q 'NOVA_MODAL_VIDEO_URL' src/lib/privateGpuVideoPool.js
          grep -q 'NOVA_LIGHTNING_VIDEO_URL' src/lib/privateGpuVideoPool.js
          grep -q 'NOVA_LIGHTNING_SPEECH_VIDEO_URL' src/lib/privateGpuVideoPool.js
          grep -q 'retryPrivateGpuVideoJob' src/app/api/internal/free-video-callback/route.js
          grep -q 'retryFreeVideoJobOnPublicFallback' src/app/api/internal/free-video-callback/route.js
          grep -q 'prepareFreeVideoJobRetry' src/lib/freeVideoJobs.js
          grep -q 'Wan-AI/Wan2.2-TI2V-5B' infra/modal/nova_video_worker.py
          grep -q 'Wan-AI/Wan2.2-S2V-14B' infra/modal/nova_video_worker.py
          grep -q -- '--tts_prompt_text' infra/modal/nova_video_worker.py
          grep -q 'isNovaAdminUser' src/lib/db.ts
          grep -q 'BUILT_IN_ADMIN_EMAIL_HASHES' src/lib/novaAdminAccess.js
          grep -q 'key !== "nova-video-free"' src/components/NovaGenerationStudio.jsx
          grep -q 'isFreeImageRuntimeHealthy' src/app/api/free-usage/route.js
          grep -q 'isVerifiedVideoRuntimeHealthy' src/app/api/free-usage/route.js
          grep -q 'runPublicGenerationWithQueueFallback' src/app/api/free-video-generate/route.js
          grep -q 'directVideoPrompt' src/app/api/free-video-generate/route.js
          grep -q 'planVideoWithLlm' src/app/api/free-video-generate/route.js
          grep -q '_xfade_many' infra/modal/nova_video_worker.py
          grep -q 'class NovaLtxVideo' infra/modal/nova_video_worker.py
          grep -q 'class NovaPlanner' infra/modal/nova_video_worker.py
          grep -q '_subtitle_overlays' infra/modal/nova_video_worker.py
          grep -q '_render_text_png' infra/modal/nova_video_worker.py
          grep -q '_remove_model_text' infra/modal/nova_video_worker.py
          grep -q 'markForWorkerPlanning' src/app/api/free-video-generate/route.js
          grep -q '_director_speech_generate' infra/modal/nova_video_worker.py
          grep -q 'engineOrderFor' src/app/api/free-video-generate/route.js
          grep -q 'sidechaincompress' infra/modal/nova_video_worker.py
          grep -q 'NOVA Prompt Director ativo' src/components/NovaFreeVideoStudio.jsx
          grep -q 'audioRequired' src/lib/verifiedVideoRuntime.js
          grep -q 'director_timeline' src/app/api/free-video-generate/route.js
          grep -q 'kokoro>=0.9.2' infra/modal/nova_video_worker.py
          grep -q '_render_director_sequence' infra/modal/nova_video_worker.py
          grep -q '_overlay_director_captions' infra/modal/nova_video_worker.py
          grep -q '_build_director_audio' infra/modal/nova_video_worker.py
          grep -q 'smoke_complex_director' infra/modal/nova_video_worker.py
          grep -q '_motion_quality_ok' infra/modal/nova_video_worker.py
          grep -q 'NOVA_LOW_MOTION_QUALITY' infra/modal/nova_video_worker.py
          grep -q 'complex director failure will not degrade' src/app/api/internal/free-video-callback/route.js
          grep -q 'NOVA_COMPLEX_VIDEO_DIRECTOR_UNAVAILABLE' src/app/api/free-video-generate/route.js
          grep -q 'const workers = workersForInput(input);' src/lib/privateGpuVideoPool.js
          grep -q 'const workers = workersForTask(task);' src/lib/privateGpuVideoPool.js
          if grep -q 'normal_generate = ' infra/modal/apply_quality_patch.py; then
            echo 'Modal quality patch must not replace the director generation function.'
            exit 1
          fi

          if grep -q 'useSearchParams' src/app/oauth/callback/huggingface/page.jsx; then
            echo 'OAuth callback must not read search params during prerender.'
            exit 1
          fi

          if grep -Eqi '@cf/|fal-ai|fal\.run|huggingface\.co|modal\.' src/lib/publicGenerationCatalog.js; then
            echo 'Provider/model detail leaked into public generation catalog.'
            exit 1
          fi

          if grep -Eqi 'gmail\.com|outlook\.com|hotmail\.com|yahoo\.com' src/lib/novaAdminAccess.js; then
            echo 'Plaintext admin email found in public source.'
            exit 1
          fi

          echo 'NOVA included generation contracts: OK'
