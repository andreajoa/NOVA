name: Diagnose NOVA Modal Live
# Active call probe: 2026-08-29 22:49 UTC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-modal-live.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal>=1.5,<2"

      - name: Fetch active generation logs
        shell: bash
        run: |
          set -euo pipefail
          modal app logs nova-video-engine --since 30m --tail 1000 --timestamps --show-function-id --show-function-call-id --show-container-id --function-call fc-01M17V3CDKH9GWEK7KNG7T19D1 | tee modal-live.log
          echo "--- LAST 80 LINES ---"
          tail -n 80 modal-live.log
          echo "--- ERROR SUMMARY ---"
          grep -E -i "Traceback|Error|Exception|failed|killed|timeout|out of memory|CUDA|No module|exit code" modal-live.log || true
